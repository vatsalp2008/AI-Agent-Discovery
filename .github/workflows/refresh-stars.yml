name: Refresh catalogue

# Star counts in data/agents.json drift as projects grow. This re-reads them
# weekly from the GitHub API and commits the result directly.
#
# It opened a pull request originally, but creating one requires the repo
# setting "Allow GitHub Actions to create and approve pull requests", which is
# off by default — the job pushed its branch and then failed every week. There
# is nothing to review here anyway: the numbers come from an authoritative API
# and git history is the audit trail.
on:
  schedule:
    # Mondays, 06:00 UTC. Off-peak, so the GitHub API is responsive.
    - cron: "0 6 * * 1"
  workflow_dispatch:  # and on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The change history is built by walking every commit that touched
          # data/agents.json. A shallow clone has one, so the weekly job
          # would replace the whole history with a single entry.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements.txt

      - name: Refresh catalogue
        env:
          # Raises the API limit from 60/hour to 5000/hour, which matters
          # because the catalogue has more agents than the anonymous budget.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ai-agent-discovery/refresh_stars.py

      # Only data/agents.json is staged, so a stray file from the run cannot
      # ride along. `git diff --quiet` keeps a no-change week from making an
      # empty commit.
      - name: Commit any changes
        run: |
          set -eo pipefail
          if git diff --quiet -- data/agents.json; then
            echo "Star counts are unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agents.json
          git commit -m "Refresh GitHub star counts"
          git push

          echo "### Star counts refreshed" >> "$GITHUB_STEP_SUMMARY"
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"

      # The index still holds the old numbers until someone re-seeds; say so
      # rather than leaving the catalogue and index quietly out of step.
      - name: Note that the index needs rebuilding
        run: echo "Run \`make seed\` to rebuild the index with the new counts." >> "$GITHUB_STEP_SUMMARY"

      # Archived and dormant projects are written back as a status, so the
      # catalogue says so on the card. --apply-status refuses to write if any
      # repository could not be checked, since an unchecked entry looks
      # "not flagged" and would have a real warning cleared.
      # Renames are the one finding with an unambiguous fix: the audit
      # already knows the new path. Run before the status pass so a project
      # that was both renamed and archived is recorded at its new URL.
      - name: Follow repository renames
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python ai-agent-discovery/audit.py --follow-moves || true

          # Its own commit: swept into the status commit below, the change
          # history and the Atom feed would describe a URL rewrite as a
          # health update.
          if git diff --quiet -- data/agents.json; then
            echo "No renames to follow."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agents.json
          git commit -m "Follow renamed repository URLs"
          git push

      - name: Audit entry health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python ai-agent-discovery/audit.py --apply-status > audit.log 2>&1 || true
          # Reused by the digest below, so it costs no extra API budget.
          python ai-agent-discovery/audit.py --json > audit.json 2>/dev/null || echo '[]' > audit.json
          {
            echo "### Catalogue health"
            echo '```'
            tail -40 audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit status changes
        run: |
          set -eo pipefail
          if git diff --quiet -- data/agents.json; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agents.json
          git commit -m "Update project health statuses"
          git push

      # Rebuilt after the commits above, so the feed includes them. Derived
      # from git history, so it is always regenerable — a failure here is
      # worth reporting but not worth failing the job over.
      - name: Rebuild the change history
        run: |
          set -eo pipefail
          if ! python ai-agent-discovery/changelog.py; then
            echo "::warning::Could not rebuild the change history."
            exit 0
          fi
          if git diff --quiet -- data/changelog.json; then
            echo "Change history is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/changelog.json
          git commit -m "Rebuild the catalogue change history"
          git push

      # One report instead of four step summaries nobody scrolls to. Opened
      # only when something actually happened: a weekly issue saying "nothing
      # changed" trains everyone to close it unread.
      - name: Open the weekly digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          python ai-agent-discovery/digest.py --days 7 --audit audit.json --out digest.md

          if grep -q "Nothing changed" digest.md && grep -q "Nothing outstanding" digest.md; then
            echo "A quiet week; no digest issue."
            cat digest.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo
            echo "Built from \`data/changelog.json\` and this run's audit."
            echo "See [the change history](../../blob/main/data/changelog.json) or"
            echo "subscribe to \`/api/changelog.atom\`."
          } >> digest.md

          cat digest.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create \
            --title "Catalogue digest — $(date -u +%Y-%m-%d)" \
            --body-file digest.md \
            || echo "::warning::Could not open the digest issue."

      # Projects get renamed, archived and deleted. A redirect is reported but
      # tolerated — the link still works. A *broken* link is a real defect in
      # the catalogue, and a summary nobody reads is not a signal, so the job
      # fails on one. Run twice before failing, so a transient outage on a
      # single host does not turn the weekly job red.
      - name: Check catalogue links
        run: |
          set -o pipefail
          if ! python ai-agent-discovery/check_links.py --fail-on-broken > links.log 2>&1; then
            echo "Broken links found; re-checking to rule out a transient failure." >&2
            sleep 20
            python ai-agent-discovery/check_links.py --fail-on-broken > links.log 2>&1 || FAILED=1
          fi

          {
            echo "### Catalogue links"
            echo '```'
            tail -30 links.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${FAILED:-}" ]; then
            echo "::error::The catalogue contains broken links (see the summary)."
            exit 1
          fi
