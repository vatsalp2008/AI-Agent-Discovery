name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A run superseded by a newer push tells you nothing useful, and the live job
# holds an Ollama container for minutes. Cancel in-flight runs for the same
# ref — except on main, where each commit's result is worth keeping so a
# failure cannot be masked by the next push cancelling its run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-agent-discovery/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      # The suite stubs langchain, so this catches import errors the tests
      # would otherwise hide.
      - name: Check backend imports resolve
        working-directory: ai-agent-discovery/backend
        run: python -c "import api, config, embeddings, generation, models, rate_limit, request_log, scoring, scraper, vectorstore"

      - name: Byte-compile all sources
        run: python -m compileall -q ai-agent-discovery

  # Exercises the real embedding and chat models against a throwaway Ollama.
  # Kept separate from `test` so an Ollama outage cannot block ordinary CI, and
  # skipped on forks where the long model pull is rarely wanted.
  live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 25
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-agent-discovery/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements-dev.txt

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && exit 0
            sleep 2
          done
          echo "Ollama did not become ready" >&2
          exit 1

      - name: Pull models
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"name":"nomic-embed-text"}' > /dev/null
          curl -sf http://localhost:11434/api/pull -d '{"name":"llama3.2"}' > /dev/null

      - name: Seed the index
        run: python ai-agent-discovery/seed.py

      # The suite skips itself when Ollama is unreachable, which would turn a
      # broken setup into a silent pass. LIVE_TESTS_REQUIRED makes any skip a
      # failure — enforced in tests-live/conftest.py rather than by grepping
      # pytest's console output, which it is free to reword.
      - name: Run live tests
        env:
          LIVE_TESTS_REQUIRED: "1"
        run: python -m pytest tests-live -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
