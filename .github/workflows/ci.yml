name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every commit on main gets its own concurrency group, keyed by SHA, so a run
# can never be cancelled by a later push — each commit's result stands on its
# own. Pull requests group by ref instead, where only the latest push matters.
#
# The grouping does the work rather than `cancel-in-progress`: an expression
# there is coerced to a string, and the non-empty "false" reads as truthy, so
# `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}` cancelled runs
# on main anyway. Five results were discarded that way before this was found.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-agent-discovery/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest

      # The suite stubs langchain, so this catches import errors the tests
      # would otherwise hide.
      - name: Check backend imports resolve
        working-directory: ai-agent-discovery/backend
        run: python -c "import admin, api, changelog_data, config, embedding_cache, embeddings, generation, logging_setup, models, rate_limit, request_log, scoring, scraper, security, submissions, vectorstore"

      # compileall below catches syntax errors but not import errors, and
      # these scripts have no unit tests that import them — discover.py had
      # none at all until it was added here.
      - name: Check script imports resolve
        working-directory: ai-agent-discovery
        run: python -c "import audit, benchmark, changelog, check_links, cli, digest, discover, doctor, mcp_server, refresh_stars, seed"

      - name: Byte-compile all sources
        run: python -m compileall -q ai-agent-discovery

      # doctor must run without an index or a reachable Ollama; it is the
      # thing people run *because* their setup is broken.
      - name: Check doctor runs on a bare checkout
        run: |
          set -eo pipefail
          OLLAMA_BASE_URL=http://localhost:59999 python ai-agent-discovery/doctor.py > doctor.log 2>&1 || true
          grep -q "cannot reach" doctor.log
          grep -q "ollama serve" doctor.log

  # Exercises the real embedding and chat models against a throwaway Ollama.
  # Kept separate from `test` so an Ollama outage cannot block ordinary CI, and
  # skipped on forks where the long model pull is rarely wanted.
  live:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 25
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-agent-discovery/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements-dev.txt

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags && exit 0
            sleep 2
          done
          echo "Ollama did not become ready" >&2
          exit 1

      - name: Pull models
        run: |
          curl -sf http://localhost:11434/api/pull -d '{"name":"nomic-embed-text"}' > /dev/null
          curl -sf http://localhost:11434/api/pull -d '{"name":"llama3.2"}' > /dev/null

      - name: Seed the index
        run: python ai-agent-discovery/seed.py

      # Exits non-zero if anything required is missing, so a broken setup
      # fails here with a clear message rather than as odd test failures.
      - name: Check the setup with doctor
        run: python ai-agent-discovery/doctor.py

      # The MCP server is a separate entry point, so a break in it would not
      # show up in the other suites. Drive it the way a client would.
      - name: Check the MCP server answers over stdio
        run: |
          python - <<'PY'
          import asyncio, json, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(
                  command=sys.executable,
                  args=[os.path.abspath("ai-agent-discovery/mcp_server.py")])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      names = {t.name for t in (await session.list_tools()).tools}
                      assert "search_agents" in names, names

                      result = await session.call_tool(
                          "search_agents", {"query": "terminal coding agent", "limit": 3})
                      payload = json.loads(result.content[0].text)
                      assert payload["results"], "search returned nothing"
                      print("MCP server answered with", len(payload["results"]), "results")

          asyncio.run(asyncio.wait_for(main(), timeout=180))
          PY

      # Catches a regression that makes the app dramatically slower without
      # failing any test. Not a threshold check: runner speed varies too much.
      - name: Report benchmark numbers
        run: python ai-agent-discovery/benchmark.py

      # The suite skips itself when Ollama is unreachable, which would turn a
      # broken setup into a silent pass. LIVE_TESTS_REQUIRED makes any skip a
      # failure — enforced in tests-live/conftest.py rather than by grepping
      # pytest's console output, which it is free to reword.
      - name: Run live tests
        env:
          LIVE_TESTS_REQUIRED: "1"
        run: python -m pytest tests-live -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm test
