name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-agent-discovery/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ai-agent-discovery/requirements-dev.txt

      - name: Run tests
        run: pytest

      # The suite stubs langchain, so this catches import errors the tests
      # would otherwise hide.
      - name: Check backend imports resolve
        working-directory: ai-agent-discovery/backend
        run: python -c "import api, config, embeddings, models, scoring, scraper, vectorstore"

      - name: Byte-compile all sources
        run: python -m compileall -q ai-agent-discovery
