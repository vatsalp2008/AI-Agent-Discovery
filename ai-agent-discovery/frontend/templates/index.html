{% extends "base.html" %}

{% block title %}AI Agent Discovery | Find the best AI Agents{% endblock %}

{% block content %}
<section class="hero">
    <h1>Discover AI Agents</h1>
    <p>Find the perfect AI agent for your needs using natural language.</p>

    <form class="search-container" id="searchForm" role="search">
        <label class="sr-only" for="searchInput">Search for an AI agent</label>
        <input type="search" id="searchInput" class="search-input" name="q"
               autocomplete="off" role="combobox" aria-expanded="false"
               aria-controls="suggestions" aria-autocomplete="list"
               placeholder="e.g., 'Agent that can write python code in VS Code'...">
        <ul class="suggestions" id="suggestions" role="listbox"
            aria-label="Matching agent names" hidden></ul>
        <button id="searchBtn" class="search-btn" type="submit" aria-label="Search">
            <ion-icon name="search-outline" aria-hidden="true"></ion-icon>
        </button>
    </form>

    <div class="filters" id="filters" role="group" aria-label="Filter by category">
        <!-- Populated from /api/categories -->
    </div>

    <div class="search-options">
        <label class="option-toggle" for="maintainedOnly">
            <input type="checkbox" id="maintainedOnly">
            Only maintained projects
        </label>
    </div>

    <div class="recent" id="recent" hidden>
        <span class="recent-label" id="recentLabel">Recent</span>
        <span class="recent-list" id="recentList" role="group" aria-labelledby="recentLabel"></span>
        <button type="button" id="recentClear" class="recent-clear">Clear</button>
    </div>
</section>

<main id="resultsArea" aria-live="polite" aria-busy="false">
    <!-- Results are injected here -->
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/agents-api.js"></script>
<script src="/static/js/search-state.js"></script>
<script src="/static/js/suggest.js"></script>
<script src="/static/js/search-suggestions.js"></script>
<script src="/static/js/recent-searches.js"></script>
<script src="/static/js/collections.js"></script>
<script src="/static/js/saved-searches.js"></script>
<script src="/static/js/export-results.js"></script>
<script src="/static/js/main.js"></script>
{% endblock %}
