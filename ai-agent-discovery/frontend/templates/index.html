{% extends "base.html" %}

{% block title %}AI Agent Discovery | Find the best AI Agents{% endblock %}

{% block content %}
<section class="hero">
    <h1>Discover AI Agents</h1>
    <p>Find the perfect AI agent for your needs using natural language.</p>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input"
               placeholder="e.g., 'Agent that can write python code in VS Code'...">
        <button id="searchBtn" class="search-btn">
            <ion-icon name="search-outline"></ion-icon>
        </button>
    </div>

    <div class="filters" id="filters">
        <!-- Populated from /api/categories -->
    </div>
</section>

<main id="resultsArea">
    <!-- Results are injected here -->
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/main.js"></script>
{% endblock %}
