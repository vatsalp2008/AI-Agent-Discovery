{% extends "base.html" %}

{% block title %}Dashboard | AI Agent Discovery{% endblock %}

{% block content %}
<section class="hero hero-compact">
    <h1>Dashboard</h1>
    <p>Overview of the indexed AI agents.</p>
</section>

<div class="stats-grid" id="statsGrid">
    <div class="stat-card">
        <div class="stat-number" id="totalAgents">-</div>
        <div class="stat-label">Total Agents Indexed</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" id="topCategory">-</div>
        <div class="stat-label">Top Category</div>
    </div>
    <div class="stat-card">
        <div class="stat-number" id="totalStars">-</div>
        <div class="stat-label">Total GitHub Stars</div>
    </div>
</div>

<h2 class="section-heading">All Agents</h2>
<div class="results-grid" id="allAgentsGrid">
    <!-- Populated via JS -->
    <div class="loading">
        <div class="spinner"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
