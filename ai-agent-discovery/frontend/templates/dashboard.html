{% extends "base.html" %}

{% block title %}Dashboard | AI Agent Discovery{% endblock %}

{% block content %}
<main>
    <section class="hero hero-compact">
        <h1>Dashboard</h1>
        <p>Overview of the indexed AI agents.</p>
    </section>

    <!-- Values arrive from /api/stats, so announce them once they land. -->
    <dl class="stats-grid" id="statsGrid" aria-live="polite" aria-busy="true">
        <div class="stat-card">
            <dt class="stat-label">Total Agents Indexed</dt>
            <dd class="stat-number" id="totalAgents">-</dd>
        </div>
        <div class="stat-card">
            <dt class="stat-label">Top Category</dt>
            <dd class="stat-number" id="topCategory">-</dd>
        </div>
        <div class="stat-card">
            <dt class="stat-label">Total GitHub Stars</dt>
            <dd class="stat-number" id="totalStars">-</dd>
        </div>
    </dl>

    <h2 class="section-heading" id="allAgentsHeading">All Agents</h2>

    <div class="controls" role="group" aria-labelledby="allAgentsHeading">
        <label class="sr-only" for="filterQuery">Filter by name or description</label>
        <input type="search" id="filterQuery" class="control-input" placeholder="Filter by name…" autocomplete="off">

        <label class="sr-only" for="filterCategory">Category</label>
        <select id="filterCategory" class="control-select">
            <option value="">All categories</option>
        </select>

        <label class="sr-only" for="filterTech">Technology</label>
        <select id="filterTech" class="control-select">
            <option value="">All technologies</option>
        </select>

        <label class="sr-only" for="sortBy">Sort by</label>
        <select id="sortBy" class="control-select">
            <option value="name">Name</option>
            <option value="stars">Stars</option>
            <option value="category">Category</option>
        </select>

        <button type="button" id="sortOrder" class="control-button" aria-label="Sort ascending">↑</button>
    </div>
    <div class="results-grid" id="allAgentsGrid" aria-labelledby="allAgentsHeading" aria-busy="true">
        <!-- Populated via JS -->
        <div class="loading" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <span class="sr-only">Loading agents…</span>
        </div>
    </div>
    <div class="grid-footer" id="gridFooter"></div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard-stats.js"></script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
