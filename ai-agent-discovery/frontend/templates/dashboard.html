<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Agent Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">
                <ion-icon name="planet-outline" style="vertical-align: middle; margin-right: 5px;"></ion-icon>
                AgentDiscovery
            </a>
            <nav>
                <a href="/">Search</a>
                <a href="/dashboard" class="active">Dashboard</a>
            </nav>
        </header>

        <section class="hero" style="margin-bottom: 2rem; text-align: left;">
            <h1>Dashboard</h1>
            <p>Overview of the indexed AI agents.</p>
        </section>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalAgents">-</div>
                <div class="stat-label">Total Agents Indexed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="topCategory">-</div>
                <div class="stat-label">Top Category</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStars">-</div>
                <div class="stat-label">Total GitHub Stars</div>
            </div>
        </div>

        <h2 style="margin-bottom: 1.5rem; color: var(--text-primary);">All Agents</h2>
        <div class="results-grid" id="allAgentsGrid">
            <!-- Populated via JS -->
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const totalAgentsEl = document.getElementById('totalAgents');
            const topCategoryEl = document.getElementById('topCategory');
            const totalStarsEl = document.getElementById('totalStars');
            const grid = document.getElementById('allAgentsGrid');

            try {
                // Fetch All Agents
                const response = await fetch('/api/agents');
                const agents = await response.json();

                // Calculate Stats
                totalAgentsEl.textContent = agents.length;

                const categories = {};
                let stars = 0;
                agents.forEach(a => {
                    const cat = a.metadata.category || 'Uncategorized';
                    categories[cat] = (categories[cat] || 0) + 1;
                    stars += (a.metadata.stars || 0);
                });

                const sortedCats = Object.entries(categories).sort((a, b) => b[1] - a[1]);
                topCategoryEl.textContent = sortedCats.length > 0 ? sortedCats[0][0] : 'N/A';

                totalStarsEl.textContent = stars >= 1000000 ? (stars / 1000000).toFixed(1) + 'M+' : (stars / 1000).toFixed(1) + 'k';

                // Render Grid
                grid.innerHTML = '';
                agents.forEach(agent => {
                    // Similar card logic
                    const card = document.createElement('div');
                    card.className = 'agent-card';

                    let stack = agent.metadata.stack;
                    if (typeof stack === 'string') stack = stack.split(',');
                    const stackHtml = stack.map(tech => `<span class="tech-item">${tech.trim()}</span>`).join('');

                    card.innerHTML = `
                        <div class="card-header">
                            <div class="agent-name">${agent.metadata.name}</div>
                            <div class="agent-category">${agent.metadata.category}</div>
                        </div>
                         <div class="agent-description">
                            ${agent.metadata.description || 'No description available.'}
                        </div>
                        <div class="tech-stack">
                            ${stackHtml}
                        </div>
                        <div class="card-footer">
                            <div class="stars">
                                <ion-icon name="star"></ion-icon>
                                <span>${agent.metadata.stars}</span>
                            </div>
                            <a href="${agent.metadata.url}" target="_blank" class="view-btn">View &rarr;</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<p>Error loading dashboard data.</p>';
            }
        });
    </script>
</body>

</html>
