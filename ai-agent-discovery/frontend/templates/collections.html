{% extends "base.html" %}

{% block title %}Collections | AI Agent Discovery{% endblock %}

{% block content %}
<section class="hero hero-compact">
    <h1>Collections</h1>
    <p>Shortlists of agents, kept in this browser. Nothing is sent anywhere.</p>
</section>

<form class="controls" id="newCollectionForm">
    <label class="sr-only" for="newCollectionName">New collection name</label>
    <input type="text" id="newCollectionName" class="control-input"
           placeholder="New collection…" autocomplete="off" maxlength="60">
    <button type="submit" class="control-button">Create</button>
</form>

<div class="controls">
    <button type="button" id="exportCollections" class="control-button">Export</button>
    <label class="control-button" for="importCollections">Import
        <input type="file" id="importCollections" accept="application/json,.json" class="sr-only">
    </label>
</div>

<!-- One live region rather than two toggled paragraphs: content inside a
     hidden element is never announced, so a failed create or import reached
     sighted users only. -->
<div id="collectionsResult" aria-live="polite"></div>

<main id="collectionsArea" aria-live="polite"></main>
{% endblock %}

{% block scripts %}
<script src="/static/js/collections.js"></script>
<script src="/static/js/collections-page.js"></script>
{% endblock %}
