<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Agent Discovery{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!-- Loaded in <head> without defer so the saved theme is applied before
         first paint; the CSP forbids the usual inline snippet. -->
    <script src="/static/js/theme.js"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">
                <ion-icon name="planet-outline" aria-hidden="true"></ion-icon>
                AgentDiscovery
            </a>
            <nav aria-label="Main">
                <a href="/" {% if page == 'search' %}class="active" aria-current="page"{% endif %}>Search</a>
                <a href="/dashboard" {% if page == 'dashboard' %}class="active" aria-current="page"{% endif %}>Dashboard</a>
                <button type="button" id="themeToggle" class="theme-toggle"
                        aria-label="Switch theme">☀</button>
            </nav>
        </header>

        {% block content %}{% endblock %}
    </div>

    <script src="/static/js/agent-card.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
